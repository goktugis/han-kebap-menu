<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Han Kebap Steakhouse | Menü</title>
  <meta name="description" content="Han Kebap Steakhouse dijital menü: steaklar, kebaplar, başlangıçlar, tatlılar ve içecekler.">
  <meta name="theme-color" content="#14110f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero" id="top">
    <div class="hero__content">
      <p class="hero__eyebrow">Hoş geldiniz</p>
      <h1 class="hero__title"><span id="restName">Han Kebap</span></h1>
      <p class="hero__sub" id="restSub">Steakhouse</p>
      <span class="hero__divider" aria-hidden="true"></span>
      <p class="hero__tagline" id="restTagline"></p>
    </div>
  </header>

  <div class="topbar" id="topbar">
    <div class="topbar__inner">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4-4"/></svg>
        <input id="search" class="search__input" type="search" placeholder="Menüde ara…" autocomplete="off" enterkeyhint="search" aria-label="Menüde ara">
        <button id="searchClear" class="search__clear" type="button" aria-label="Aramayı temizle" hidden>&times;</button>
      </div>
      <nav class="cats" aria-label="Kategoriler">
        <ul class="cats__list" id="catNav"></ul>
      </nav>
    </div>
  </div>

  <main class="container">
    <div class="filters" id="filters" role="group" aria-label="Filtreler"></div>
    <div id="menu"></div>
    <p class="empty" id="empty" hidden>Aramanıza uygun ürün bulunamadı.</p>
  </main>

  <footer class="footer">
    <h2 class="footer__brand" id="footName"></h2>
    <ul class="footer__info">
      <li id="footHours"></li>
      <li id="footAddress"></li>
      <li><a id="footPhone" href="#"></a></li>
      <li><a id="footInsta" href="#" target="_blank" rel="noopener" hidden></a></li>
    </ul>
    <p class="footer__note" id="footNote"></p>
    <p class="footer__legend">
      <span class="badge badge--sef">Şefin Önerisi</span>
      <span class="badge badge--aci">Acılı</span>
      <span class="badge badge--vegan">Vejetaryen</span>
    </p>
  </footer>

  <button id="toTop" class="to-top" type="button" aria-label="Yukarı çık" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></svg>
  </button>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetName">
    <form method="dialog"><button class="sheet__close" aria-label="Kapat">&times;</button></form>
    <img id="sheetImg" class="sheet__img" alt="">
    <div class="sheet__body">
      <h3 id="sheetName" class="sheet__name"></h3>
      <p id="sheetDesc" class="sheet__desc"></p>
      <div class="sheet__row"><span id="sheetTags"></span><span id="sheetPrice" class="price"></span></div>
    </div>
  </dialog>

  <script src="menu-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
